name: Cleanup preview assets

# This job removes old preview-namespaced Cloudflare assets: Images,
# Stream, and R2 objects past the cutoff (issue #432). Non-prod deploys
# mark every upload with a `preview-` prefix (Images and R2) or a
# `meta.env=preview` tag (Stream). This job deletes only the stale,
# preview-marked ones, so preview test uploads do not build up in the
# shared account. See scripts/cleanup-preview-assets.ts.

on:
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'Delete preview assets older than this many days'
        required: false
        default: '7'
      apply:
        description: 'Actually delete (leave unchecked for a dry run)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: cleanup-preview-assets
  cancel-in-progress: false

jobs:
  cleanup:
    name: Reap preview-namespaced storage assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # One token covers all three backends: Images:Edit, Stream:Edit, and
      # R2 Object Read & Write. The script derives R2's S3 credentials from
      # it, so it is the only secret here. The bucket name and jurisdiction
      # are plain configuration, so they stay unmasked. A masked
      # `R2_BUCKET: ***` would make an R2 403 error hard to read.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      # The bucket is jurisdiction-bound. It answers only on the matching
      # host. On the default host, R2 returns AccessDenied instead, which
      # looks like a permissions problem but is not one.
      R2_JURISDICTION: eu
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Scheduled runs always delete. Manual runs delete only when `apply`
      # is checked. Otherwise they print a dry-run report.
      #
      # All three secrets above are required. The script exits 1 without
      # them, on purpose: a cleanup that silently deletes nothing is worse
      # than a loud failure. It once read a secret name that did not
      # exist, and it failed every night for six weeks, unnoticed.
      - name: Cleanup preview assets
        run: >-
          pnpm tsx scripts/cleanup-preview-assets.ts
          --days ${{ github.event.inputs.days || '7' }}
          ${{ (github.event_name == 'schedule' || github.event.inputs.apply == 'true') && '--apply' || '' }}

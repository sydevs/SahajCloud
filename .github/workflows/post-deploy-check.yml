name: Post-deploy check

# Railway deploys production when `main` moves, and runs migrations in-process at boot. Nothing
# in this repo said whether that deploy came up. This job waits for production to serve THIS
# commit and fails the run, visibly, when it does not.
#
# It is read-only: one GET of `/api/health`, which is public and carries `commit`
# (`RAILWAY_GIT_COMMIT_SHA`). `version` is identical on every commit, so only `commit` proves the
# new build is the one answering rather than the previous instance, which Railway keeps serving
# until the new one passes its own healthcheck (`railway.toml`).
#
# It cannot stop a deploy and does not try. Holding a deploy behind CI is a Railway setting
# ("Wait for CI"), which is dashboard-only: see DEPLOYMENT.md, "Post-deploy check".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older check: production will never serve the older commit once the
# newer one deploys, so waiting for it would only fail.
concurrency:
  group: post-deploy-check
  cancel-in-progress: true

jobs:
  health:
    name: Production serves this commit
    runs-on: ubuntu-latest
    # The wait below is 25 minutes. A Railway build plus boot takes well under 10, but a deploy
    # held behind "Wait for CI" waits for CI first.
    timeout-minutes: 30
    env:
      HEALTH_URL: https://cloud.sydevelopers.com/api/health
      EXPECTED_SHA: ${{ github.sha }}
      DEADLINE_SECONDS: '1500'
      INTERVAL_SECONDS: '20'
    steps:
      - name: Wait for the deploy, then check health
        run: |
          set -u
          start=$(date +%s)
          last="no response yet"
          # Cloudflare sits in front of this host and ignores a client's `Cache-Control` by
          # default, so the unique query string is what misses the edge cache. `/api/health`
          # reads no query parameter.
          url="${HEALTH_URL}?sha=${EXPECTED_SHA}"
          while true; do
            body=$(curl --silent --show-error --max-time 15 "$url" 2>&1) && code=0 || code=$?
            if [ "$code" -eq 0 ]; then
              status=$(printf '%s' "$body" | jq -r '.status // "?"' 2>/dev/null || echo '?')
              commit=$(printf '%s' "$body" | jq -r '.commit // "absent"' 2>/dev/null || echo '?')
              last="status=${status} commit=${commit}"
              if [ "$status" = "ok" ] && [ "$commit" = "$EXPECTED_SHA" ]; then
                echo "Production is healthy and serving ${EXPECTED_SHA}."
                printf '%s\n' "$body" | jq .
                exit 0
              fi
              # `ok` on another commit is the previous instance, still serving. Keep waiting.
              if [ "$status" = "ok" ]; then
                echo "Healthy, but serving ${commit}, not ${EXPECTED_SHA} yet."
              else
                echo "Not healthy yet (${last})."
              fi
            else
              last="request failed: ${body}"
              echo "Not reachable yet (${last})."
            fi
            if [ $(( $(date +%s) - start )) -ge "$DEADLINE_SECONDS" ]; then
              echo "::error title=Production did not serve ${EXPECTED_SHA}::Last answer from ${url}: ${last}. Check the Railway deploy logs (a failed migration stops the server) and DEPLOYMENT.md, Troubleshooting."
              exit 1
            fi
            sleep "$INTERVAL_SECONDS"
          done

# Updates Stage, assignees, and the `awaiting` label from GitHub events.
# Adds new items to the org workflow board. All rules live in one reusable
# workflow, so the five repos cannot drift apart:
# https://github.com/sydevs/claude-workflow/blob/main/.github/workflows/state-machine.yml
name: Workflow state

on:
  issues:
    types: [opened, reopened, transferred, closed, assigned, field_added, field_removed]
  issue_comment:
    types: [created]
  # pull_request_target, not pull_request: the org secret must be present,
  # and nothing gets checked out here. That is what makes it safe.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, closed]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  state:
    uses: sydevs/claude-workflow/.github/workflows/state-machine.yml@main
    secrets:
      token: ${{ secrets.ADD_TO_PROJECT_PAT }}

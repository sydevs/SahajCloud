name: CI

on:
  pull_request:
  # The merge queue runs the required checks against a merge_group ref, not
  # the PR head. Without this trigger the check never reports and the queue
  # stalls forever. (why: sydevs/claude-workflow docs/why.md#github-owns-the-merge)
  merge_group:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read # read the Railway preview commit status (PR-preview URL discovery)
  checks: read # did the commit before a docs-only push pass this job ("Did Railway deploy this push?")

jobs:
  test:
    name: Lint, Test & Smoke
    runs-on: ubuntu-latest
    # Covers the unit and integration lanes plus the preview steps after them,
    # whose longest wait is `REACHABLE_TIMEOUT_MS` in scripts/preview-domain.ts.
    # Raise this with that bound, or a slow certificate ends the job here instead
    # of at the error naming it.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Integration tests connect here. Each suite uses an isolated schema.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payload_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Its own step, so a formatting failure names itself rather than
      # reading as a lint error. `pnpm lint` is eslint only, and nothing
      # here checked the formatter until #992: a prettier bump landed
      # without a reformat and 229 files drifted silently (#991).
      - name: Check formatting
        run: pnpm format:check
      - run: pnpm typecheck # tsc --noEmit. Neither lint nor Vitest typechecks. Only this step and the Railway build do.
      - run: pnpm typecheck:tests # the root tsconfig excludes `tests`, so specs need their own pass (#606)
      - run: pnpm test # runs test:unit and test:int (integration runs against Postgres)

      # ── Smoke specs against the Railway PR preview ──────────────────────────
      # Find the PR's Railway preview URL from Railway's commit status. This
      # uses the built-in GITHUB_TOKEN, so it needs no Railway API token.
      # Wait until the preview is healthy, then run the smoke specs against
      # it. This step skips gracefully, with an empty preview_url, when no
      # preview environment exists — for example, a PR whose own branch is
      # a deployed environment.
      # It FAILS, rather than skipping, when a deploy succeeds but publishes
      # no host. That is base-environment misconfiguration, not an absent
      # preview, and it hid a dead smoke lane for weeks (#661). Re-running
      # will not clear it — see RAILWAY_RUNBOOK.md.
      # Railway deploys a push only when it changes a path the SahajCloud
      # service's watch paths match. They leave out docs alone — the table in
      # DEPLOYMENT.md, mirrored by DOCS below — so a docs-only push gets no
      # deploy, and discovery would wait out its 12-minute timeout for a
      # status that never comes. This step asks the same question first: the
      # files changed since the push's `before` SHA, or since the PR base on
      # open.
      #
      # ⚠ A docs-only push skips only when the commit before it passed this
      # job. Otherwise a red smoke run followed by a README fix would read
      # green, though the code under it never passed. When that commit did not
      # pass, or was cancelled by a newer push, the step falls back to waiting.
      - name: Did Railway deploy this push?
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC: ${{ github.event.action == 'synchronize' }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.action == 'synchronize' && github.event.before || github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          DOCS: '(^|/)[^/]*\.md$|^(docs|\.claude|\.agents)/'
          JOB: 'Lint, Test & Smoke'
        run: |
          deployed() { echo "deployed=true" >> "$GITHUB_OUTPUT"; exit 0; }
          diff=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
            --jq '"\(.files | length)", .files[].filename') || deployed
          count=$(head -n 1 <<< "$diff")
          # Not `grep -q`: it exits on the first match, and pipefail reads tail's SIGPIPE as no match.
          code=$(tail -n +2 <<< "$diff" | grep -Ev "$DOCS" || true)
          # 300 is the compare API's file cap, so a bigger push counts as deployed.
          if (( count == 0 || count >= 300 )) || [[ -n "$code" ]]; then
            deployed
          fi
          if [[ "$SYNC" == true ]]; then
            before=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$BEFORE/check-runs" \
              -f check_name="$JOB" \
              --jq '.check_runs | sort_by(.started_at) | last | .conclusion // ""') || deployed
            [[ "$before" == success ]] || deployed
          fi
          echo "deployed=false" >> "$GITHUB_OUTPUT"
          echo "This push changed only docs, so Railway deployed nothing and there is no new build to smoke." >> "$GITHUB_STEP_SUMMARY"

      - name: Discover Railway preview URL
        id: preview
        if: ${{ steps.scope.outputs.deployed != 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm tsx scripts/get-railway-preview-url.ts
      - name: Warn when the smoke lane was skipped
        if: ${{ steps.scope.outputs.deployed != 'false' && steps.preview.outputs.preview_url == '' }}
        run: |
          echo "::warning title=Smoke specs skipped::No Railway preview was discovered for this \
          commit, so the Tier-3 smoke lane did not run. Read the 'Discover Railway preview URL' \
          step for which case this was — no preview environment, a failed deploy, or one still \
          building at the deadline. Treat this job as 'unit + integration passed', not 'smoke \
          passed'."

      # ── The preview's fixed address, and the data a reviewer opens it on ────
      # Register `pr-<n>.cloud-preview.sydevelopers.com` against the Railway host
      # discovered above. Every push runs it, so an existing address exits 0.
      # The daily sweep in `cleanup-preview-assets.yml` deletes it a day after
      # this PR closes.
      - name: Register the preview's fixed address
        id: address
        if: ${{ steps.preview.outputs.preview_url != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PREVIEW_KV_NAMESPACE_ID: ${{ vars.PREVIEW_KV_NAMESPACE_ID }}
        run: |
          url="$(pnpm -s tsx scripts/preview-domain.ts create \
            --pr '${{ github.event.pull_request.number }}' \
            --host '${{ steps.preview.outputs.preview_url }}')"
          echo "fixed_url=$url" >> "$GITHUB_OUTPUT"

      # Wait for the preview to load its committed fixture (`src/fixture/`),
      # which it does into itself at boot, so every page a reviewer opens has
      # content on it.
      #
      # ⚠ It goes RED when the load fails or never ends, and that is the point
      # (#1073, #1168): a change used to be allowed to admit "Data: not seeded"
      # in a line of its description, and every check accepted the line. A PR
      # with no preview at all still only warns, above — this step is skipped
      # there.
      #
      # ⚠ Never split this into a job of its own. A new job is a new check name
      # no ruleset requires, the merge gate reads SKIPPED as OK, and
      # sydevs/SahajCloud#903 forbids renaming a required check — so a split
      # would leave this unenforced at the gate.
      - name: Wait for the preview's fixture
        if: ${{ steps.address.outputs.fixed_url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm tsx scripts/wait-preview-fixture.ts

      - name: Run smoke specs against the preview
        if: ${{ steps.address.outputs.fixed_url != '' }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_URL: ${{ steps.address.outputs.fixed_url }}
          SMOKE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
        run: pnpm test:smoke

  # Dependency-vulnerability gate. Fails only when this PR ADDS a dependency
  # with a high or critical advisory that reaches production code. An
  # advisory against a dependency already on main fails nothing here: the
  # sydevs loop's daily Dependabot check fixes those, so an unrelated PR is
  # never blocked by something it did not cause. Shared by the sydevs repos;
  # the rules live in
  # sydevs/claude-workflow/.github/workflows/dependency-review.yml.
  dependencies:
    name: Dependency Review
    uses: sydevs/claude-workflow/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read

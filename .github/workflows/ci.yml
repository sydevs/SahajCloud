name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Integration tests connect here; each suite uses an isolated schema.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payload_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test # test:unit + test:int (integration runs against Postgres)

      # ── Smoke specs against the Railway PR preview ──────────────────────────
      # TODO(railway): set the RAILWAY_PREVIEW_URL repo/environment variable to
      # the PR's Railway preview URL (per-PR preview provisioning is infra work).
      # Until it is set, these steps are skipped so CI stays green.
      - name: Install Playwright (chromium)
        if: ${{ vars.RAILWAY_PREVIEW_URL != '' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Run smoke specs against the Railway preview
        if: ${{ vars.RAILWAY_PREVIEW_URL != '' }}
        env:
          PREVIEW_URL: ${{ vars.RAILWAY_PREVIEW_URL }}
          SMOKE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
        run: pnpm test:smoke

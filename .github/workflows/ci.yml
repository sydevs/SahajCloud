name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_WORKER_SUBDOMAIN: ${{ vars.CF_WORKER_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test # test:unit && test:int — vitest injects its own env
      # Lint + test usually takes 2-3 min, which is roughly the time CF Workers
      # Builds needs to publish the preview. By the time we reach the wait step
      # below, the preview is typically already up — no grace period needed.
      # CF_WORKER_SUBDOMAIN must be set.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for Cloudflare Workers Builds to publish preview
        id: preview
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # CF Workers Builds publishes two preview URLs per push: a
          # commit-hash one (e.g. 13a8c161-…) keyed off a CF-internal build
          # id we can't derive locally, and a branch-slug one (e.g.
          # feat-cf-preview-deploys-…) keyed off the source branch name.
          # The branch slug is deterministic — use that. Both point to the
          # same latest deploy.
          BRANCH_SLUG=$(echo "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's|[^a-z0-9]+|-|g; s|^-+||; s|-+$||')
          PREVIEW_URL="https://${BRANCH_SLUG}-sahajcloud.${CF_WORKER_SUBDOMAIN}.workers.dev"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          ./scripts/wait-for-200.sh "$PREVIEW_URL" 180
      - name: Run smoke specs
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          SMOKE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
        run: pnpm test:smoke

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm audit reads the committed pnpm-lock.yaml + package.json directly
      # (incl. pnpm.auditConfig.ignoreGhsas) — no `pnpm install` needed. High and
      # Critical advisories fail the build; Moderate/Low are reported only.
      # Baselined advisories and their rationale: .github/audit-baseline.md
      - run: pnpm audit --audit-level=high

name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test # test:unit && test:int — vitest injects its own env

  smoke-preview:
    name: Smoke preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_WORKER_SUBDOMAIN: ${{ vars.CF_WORKER_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compute preview URL
        run: |
          PREVIEW_URL=$(node scripts/compute-preview-url.mjs)
          echo "PREVIEW_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
          echo "Computed preview URL: $PREVIEW_URL"
      - name: Wait for Cloudflare Workers Builds to publish preview
        run: ./scripts/wait-for-200.sh "$PREVIEW_URL" 180
      - name: Run smoke specs
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
          SMOKE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
        run: pnpm test:smoke

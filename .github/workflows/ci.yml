name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read # read the Railway preview commit status (PR-preview URL discovery)

jobs:
  test:
    name: Lint, Test & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Integration tests connect here; each suite uses an isolated schema.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payload_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck # tsc --noEmit — lint and Vitest don't typecheck; only this + the Railway build do
      - run: pnpm typecheck:tests # the root tsconfig excludes `tests`, so specs need their own pass (#606)
      - run: pnpm test # test:unit + test:int (integration runs against Postgres)

      # ── Smoke specs against the Railway PR preview ──────────────────────────
      # Discover the PR's Railway preview URL from Railway's commit status (via
      # the built-in GITHUB_TOKEN — no Railway API token needed) and wait until
      # it's healthy, then run the smoke specs against it. Skips gracefully (empty
      # preview_url) when there's no preview env — e.g. PRs whose branch is
      # itself a deployed environment.
      - name: Discover Railway preview URL
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm tsx scripts/get-railway-preview-url.ts
      - name: Warn when the smoke lane was skipped
        if: ${{ steps.preview.outputs.preview_url == '' }}
        run: |
          echo "::warning title=Smoke specs skipped::No Railway preview was discovered for this \
          commit, so the Tier-3 smoke lane did not run. The job is still green — treat it as \
          'unit + integration passed', not 'smoke passed'."

      - name: Run smoke specs against the Railway preview
        if: ${{ steps.preview.outputs.preview_url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          SMOKE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
        run: pnpm test:smoke

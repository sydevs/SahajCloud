name: CI

on:
  pull_request:
  # The merge queue runs the required checks against a merge_group ref, not
  # the PR head. Without this trigger the check never reports and the queue
  # stalls forever. (why: sydevs/claude-workflow docs/why.md#github-owns-the-merge)
  merge_group:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read # read the Railway preview commit status (PR-preview URL discovery)

jobs:
  test:
    name: Lint, Test & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Integration tests connect here. Each suite uses an isolated schema.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payload_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Its own step, so a formatting failure names itself rather than
      # reading as a lint error. `pnpm lint` is eslint only, and nothing
      # here checked the formatter until #992: a prettier bump landed
      # without a reformat and 229 files drifted silently (#991).
      - name: Check formatting
        run: pnpm format:check
      - run: pnpm typecheck # tsc --noEmit. Neither lint nor Vitest typechecks. Only this step and the Railway build do.
      - run: pnpm typecheck:tests # the root tsconfig excludes `tests`, so specs need their own pass (#606)
      - run: pnpm test # runs test:unit and test:int (integration runs against Postgres)

      # ── Smoke specs against the Railway PR preview ──────────────────────────
      # Find the PR's Railway preview URL from Railway's commit status. This
      # uses the built-in GITHUB_TOKEN, so it needs no Railway API token.
      # Wait until the preview is healthy, then run the smoke specs against
      # it. This step skips gracefully, with an empty preview_url, when no
      # preview environment exists — for example, a PR whose own branch is
      # a deployed environment.
      # It FAILS, rather than skipping, when a deploy succeeds but publishes
      # no host. That is base-environment misconfiguration, not an absent
      # preview, and it hid a dead smoke lane for weeks (#661). Re-running
      # will not clear it — see RAILWAY_RUNBOOK.md.
      - name: Discover Railway preview URL
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm tsx scripts/get-railway-preview-url.ts
      - name: Warn when the smoke lane was skipped
        if: ${{ steps.preview.outputs.preview_url == '' }}
        run: |
          echo "::warning title=Smoke specs skipped::No Railway preview was discovered for this \
          commit, so the Tier-3 smoke lane did not run. Read the 'Discover Railway preview URL' \
          step for which case this was — no preview environment, a failed deploy, or one still \
          building at the deadline. Treat this job as 'unit + integration passed', not 'smoke \
          passed'."

      # ── The preview's fixed address, and the data a reviewer opens it on ────
      # Register `pr-<n>.cloud-preview.sydevelopers.com` against the Railway host
      # discovered above. Every push runs it, so an existing address exits 0.
      # The daily sweep in `cleanup-preview-assets.yml` deletes it a day after
      # this PR closes.
      - name: Register the preview's fixed address
        id: address
        if: ${{ steps.preview.outputs.preview_url != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          PREVIEW_KV_NAMESPACE_ID: ${{ vars.PREVIEW_KV_NAMESPACE_ID }}
        run: |
          url="$(pnpm -s tsx scripts/preview-domain.ts create \
            --pr '${{ github.event.pull_request.number }}' \
            --host '${{ steps.preview.outputs.preview_url }}')"
          echo "fixed_url=$url" >> "$GITHUB_OUTPUT"

      # Fill the preview with the committed fixture, so every page a reviewer
      # opens has content on it.
      #
      # ⚠ It goes RED on failure, and that is the point (#1073): a change used
      # to be allowed to admit "Data: not seeded" in a line of its description,
      # and every check accepted the line. A PR with no preview at all still
      # only warns, above — this step is skipped there.
      #
      # ⚠ Never split this into a job of its own. A new job is a new check name
      # no ruleset requires, the merge gate reads SKIPPED as OK, and
      # sydevs/SahajCloud#903 forbids renaming a required check — so a split
      # would leave this unenforced at the gate.
      - name: Fill the preview with the fixture
        if: ${{ steps.address.outputs.fixed_url != '' }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          SAHAJCLOUD_URL: ${{ steps.address.outputs.fixed_url }}
        run: pnpm seed preview-fixture

      - name: Run smoke specs against the preview
        if: ${{ steps.address.outputs.fixed_url != '' }}
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PREVIEW_URL: ${{ steps.address.outputs.fixed_url }}
          SMOKE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
        run: pnpm test:smoke

  # Dependency-vulnerability gate. Fails only when this PR ADDS a dependency
  # with a high or critical advisory that reaches production code. An
  # advisory against a dependency already on main fails nothing here: the
  # sydevs loop's daily Dependabot check fixes those, so an unrelated PR is
  # never blocked by something it did not cause. Shared by the sydevs repos;
  # the rules live in
  # sydevs/claude-workflow/.github/workflows/dependency-review.yml.
  dependencies:
    name: Dependency Review
    uses: sydevs/claude-workflow/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read

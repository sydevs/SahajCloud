name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, Test & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CF_WORKER_SUBDOMAIN: ${{ vars.CF_WORKER_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test # test:unit && test:int — vitest injects its own env
      # Lint + test usually takes 2-3 min, which is roughly the time CF Workers
      # Builds needs to publish the preview. By the time we reach the wait step
      # below, the preview is typically already up — no grace period needed.
      # CF_WORKER_SUBDOMAIN must be set.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Wait for Cloudflare Workers Builds to publish preview
        id: preview
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # CF Workers Builds publishes two preview URLs per push: a
          # commit-hash one (e.g. 13a8c161-…) keyed off a CF-internal build
          # id we can't derive locally, and a branch-slug one (e.g.
          # feat-cf-preview-deploys-…) keyed off the source branch name.
          # The branch slug is deterministic — use that. Both point to the
          # same latest deploy.
          BRANCH_SLUG=$(echo "$HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's|[^a-z0-9]+|-|g; s|^-+||; s|-+$||')
          PREVIEW_URL="https://${BRANCH_SLUG}-sahajcloud.${CF_WORKER_SUBDOMAIN}.workers.dev"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          ./scripts/wait-for-200.sh "$PREVIEW_URL" 180
      # CF Workers Builds publishes the preview Worker but does NOT run schema
      # migrations. The shared sahajcloud-preview D1 is only reshaped by the
      # weekly reclone, so without this step the preview runs new code against an
      # old schema. Apply pending Payload migrations to the preview D1 before the
      # smoke specs exercise it. Idempotent — already-applied migrations are
      # skipped (tracked in payload_migrations).
      - name: Apply Payload migrations to preview D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `payload migrate` loads the full Payload config, so these serverEnv
          # values must pass Zod validation. They are throwaway placeholders —
          # migrate only alters the preview D1 schema and never uses these
          # URLs/secrets at runtime.
          SAHAJCLOUD_PREVIEW_SECRET: ci-preview-migrate-placeholder
          WEMEDITATE_WEB_URL: https://wemeditate-web.contact-c66.workers.dev
          SAHAJATLAS_URL: https://atlas.sydevelopers.com
        run: pnpm run deploy:database:preview
      - name: Run smoke specs
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          SMOKE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
        run: pnpm test:smoke

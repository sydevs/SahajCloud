name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read # read the Railway preview commit status (PR-preview URL discovery)

jobs:
  test:
    name: Lint, Test & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Integration tests connect here; each suite uses an isolated schema.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payload_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test # test:unit + test:int (integration runs against Postgres)

      # ── Smoke specs against the Railway PR preview ──────────────────────────
      # Discover the PR's Railway preview URL via the Railway API and wait until
      # it's healthy, then run the smoke specs against it. Skips gracefully (empty
      # preview_url) when there's no preview env or no RAILWAY_API_TOKEN secret —
      # e.g. PRs whose branch is itself a deployed environment.
      - name: Discover Railway preview URL
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm tsx scripts/get-railway-preview-url.ts
      - name: Install Playwright (chromium)
        if: ${{ steps.preview.outputs.preview_url != '' }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Run smoke specs against the Railway preview
        if: ${{ steps.preview.outputs.preview_url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          SMOKE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
        run: pnpm test:smoke

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm audit reads the committed pnpm-lock.yaml + package.json directly
      # (incl. pnpm.auditConfig.ignoreGhsas) — no `pnpm install` needed. High and
      # Critical advisories fail the build; Moderate/Low are reported only.
      # Baselined advisories and their rationale: .github/audit-baseline.md
      - run: pnpm audit --audit-level=high

name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: read # read the Railway preview commit status (PR-preview URL discovery)

jobs:
  test:
    name: Lint, Test & Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Integration tests connect here. Each suite uses an isolated schema.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/payload_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck # tsc --noEmit. Neither lint nor Vitest typechecks. Only this step and the Railway build do.
      - run: pnpm typecheck:tests # the root tsconfig excludes `tests`, so specs need their own pass (#606)
      - run: pnpm test # runs test:unit and test:int (integration runs against Postgres)

      # ── Smoke specs against the Railway PR preview ──────────────────────────
      # Find the PR's Railway preview URL from Railway's commit status. This
      # uses the built-in GITHUB_TOKEN, so it needs no Railway API token.
      # Wait until the preview is healthy, then run the smoke specs against
      # it. This step skips gracefully, with an empty preview_url, when no
      # preview environment exists — for example, a PR whose own branch is
      # a deployed environment.
      # It FAILS, rather than skipping, when a deploy succeeds but publishes
      # no host. That is base-environment misconfiguration, not an absent
      # preview, and it hid a dead smoke lane for weeks (#661). Re-running
      # will not clear it — see RAILWAY_RUNBOOK.md.
      - name: Discover Railway preview URL
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm tsx scripts/get-railway-preview-url.ts
      - name: Warn when the smoke lane was skipped
        if: ${{ steps.preview.outputs.preview_url == '' }}
        run: |
          echo "::warning title=Smoke specs skipped::No Railway preview was discovered for this \
          commit, so the Tier-3 smoke lane did not run. Read the 'Discover Railway preview URL' \
          step for which case this was — no preview environment, a failed deploy, or one still \
          building at the deadline. Treat this job as 'unit + integration passed', not 'smoke \
          passed'."

      - name: Run smoke specs against the Railway preview
        if: ${{ steps.preview.outputs.preview_url != '' }}
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
          SMOKE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
        run: pnpm test:smoke

name: Smoke preview

# Triggered by Cloudflare Workers Builds completing a deploy for a PR.
# CF posts a check run named "Workers Builds: sahajcloud"; we wait for it
# to finish instead of polling on every PR push, which saves the 2+ min
# of billable runner time the old wait-loop spent sleeping.
#
# Caveat: check_run events use the default-branch copy of this workflow,
# not the PR head's copy. Changes to smoke-preview.yml only take effect
# after merging to main.
on:
  check_run:
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke preview
    if: |
      github.event.check_run.name == 'Workers Builds: sahajcloud'
      && github.event.check_run.conclusion == 'success'
      && github.event.check_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_WORKER_SUBDOMAIN: ${{ vars.CF_WORKER_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.check_run.head_sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run smoke specs
        env:
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          PR_NUMBER: ${{ github.event.check_run.pull_requests[0].number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          PREVIEW_URL="https://${HEAD_SHA:0:8}-sahajcloud.${CF_WORKER_SUBDOMAIN}.workers.dev"
          export PREVIEW_URL
          export SMOKE_RUN_ID="pr-${PR_NUMBER}-${RUN_ID}"
          # Liveness probe — surfaces a clear error if the deploy hasn't propagated
          # to the edge yet (rare; CF's check_run fires after edge registration).
          curl -sf "$PREVIEW_URL" -o /dev/null --retry 3 --retry-delay 5 \
            || (echo "Preview unreachable: $PREVIEW_URL" >&2 && exit 1)
          pnpm test:smoke

# pnpm settings (pnpm 10+ reads these here, not from the package.json "pnpm" field).

# Per-package install/build-script approval. pnpm 11 errors on any undecided
# build script, so every dependency that ships one must be listed.
#   true  = run it (these fetch prebuilt binaries — no compiler needed)
#   false = skip it (transitive/unused, or build-time-only; avoids a native compile
#           that would fail in the slim runtime image)
allowBuilds:
  esbuild: true
  unrs-resolver: true
  sharp: true
  '@sentry/cli': false # only used for source-map upload (gated on SENTRY_AUTH_TOKEN)
  better-sqlite3: false # transitive, unused on Postgres

# Opt out of pnpm 11's default ~24h publish-age cooldown. The committed,
# PR-reviewed lockfile is our supply-chain boundary (plus Dependabot); a moving
# wall-clock cooldown only makes frozen-lockfile builds non-deterministic (fails
# on any freshly-published transitive until it ages out). Set to a positive
# minute value to re-enable a cooldown.
minimumReleaseAge: 0

# Transitive-security overrides (Dependabot alerts, #563). Only leaves still
# flagged after an in-range parent refresh (`pnpm update`) are pinned here; every
# bump stays within the package's existing major (patch/minor, API-stable), with
# two deliberate exceptions, each marked ⚠ below.
# picomatch/minimatch are scoped to the vulnerable major so the other major line
# (already patched) is left untouched.
#
# `braces` (GHSA-vfj7-8cjw-p6xm) gets no entry and can get none: `pnpm audit`
# names `>=3.0.4`, and 3.0.3 is the newest version ever published (checked
# 2026-10-14). Both parents are build-time. Do not re-derive this.
overrides:
  # Build tooling: hold vite at 7.x (satisfies @vitejs/plugin-react@4.5.2's peer,
  # which caps at ^7; vite 7.3.6 also widens esbuild to ^0.27 || ^0.28) and
  # flatten every esbuild copy onto one patched build.
  vite: '7.3.6'
  esbuild: '0.28.1'
  dompurify: '^3.4.11'
  ws: '^8.21.0'
  flatted: '^3.4.2'
  js-yaml: '^4.3.0'
  postcss: '^8.5.10'
  '@opentelemetry/core': '^2.8.0'
  '@babel/core': '^7.29.6'
  'picomatch@^4.0.0': '^4.0.5'
  'minimatch@^3.0.0': '^3.1.3'
  # Recent moderate advisories surfaced by `pnpm audit` (not in the original #563
  # snapshot). Scoped to the vulnerable major so the already-patched line (yaml 1.x)
  # is left alone. ajv's only remaining audit flag has no fix within its 6.x line
  # (6.12.6 is the newest 6.x and already carries the $data fix), so it is left as-is.
  'yaml@^2.0.0': '^2.8.3'
  'brace-expansion@^1.0.0': '^1.1.13'
  # `undici` is pinned exactly by payload@3.86.0 (`7.28.0`), so an in-range refresh
  # cannot reach the patched build. GHSA-4cwx-7wf7-3272 (cross-user disclosure via a
  # degenerate private-cache directive) is reachable: undici is the HTTP client every
  # server-side fetch uses. Same major, patch-only.
  undici: '^7.29.1'
  # ⚠ Past a declared major, one of two. GHSA-v53p-9fqp-m79j and
  # GHSA-prgh-xp8r-p3m5 are fixed in 10.0.6, and the only range still capping at
  # 9.x is @payloadcms/email-nodemailer@3.90.2's `^9.1.1`. Taken deliberately
  # (#931): the adapter calls `createTransport`, `sendMail` and `verify`, which
  # 10.x keeps, and the only paths that reach nodemailer are a developer's
  # Mailpit transport and the preview scripts — production mail goes through
  # `resendAdapter()`. Drop this line once the adapter declares `^10`.
  nodemailer: '^10.1.1'
  # ⚠ Past a declared major, two of two. GHSA-834v-8h66-3h79 (an unvalidated
  # import alias in happy-dom's ES-module compiler reaches `process` and Node
  # built-ins) is fixed in 21.0.4, and every published @lexical/headless —
  # through 0.52.0 — still caps at `^20.9.0`. Nothing loads the vulnerable code:
  # happy-dom sits behind @lexical/headless's `/dom` subpath, which nothing in
  # the tree imports (@payloadcms/richtext-lexical takes only the root entry's
  # `createHeadlessEditor`), and the compiler runs only under
  # `enableJavaScriptEvaluation`, which defaults false. Overridden because the
  # dependency is runtime-scope, so `pnpm audit --audit-level=high` and the
  # Dependabot check both count it, and the bump is free: @lexical/headless
  # touches six symbols — `Window`, `document`, `DOMParser`,
  # `MutationObserver`, `getComputedStyle`, `happyDOM.close` — all unchanged in
  # 21, whose one breaking change turns CSS and iframe file loading off by
  # default. Drop this line once @lexical/headless declares `^21`.
  happy-dom: '^21.0.4'

patchedDependencies:
  # `payload migrate:create` crashes with "Cannot read properties of undefined
  # (reading 'columns')" whenever a migration renames a table that also has
  # altered columns — which is every collection rename. applyPgSnapshotsDiff
  # hands preparePgAlterColumns the raw `json1` snapshot instead of the
  # rename-patched one, so the old table is looked up under its new name and
  # comes back undefined. Still broken upstream through drizzle-kit 0.31.10,
  # and @payloadcms/db-postgres pins 0.31.7 exactly, so patch rather than bump.
  drizzle-kit@0.31.7: patches/drizzle-kit@0.31.7.patch

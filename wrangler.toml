name = "sahajcloud"
compatibility_date = "2025-11-27"
# Custom entry wraps the OpenNext-generated worker (.open-next/worker.js,
# created by the [build] command below) with Sentry's withSentry() so the
# SDK client is attached to the Worker request context — without this
# wrapper Sentry.captureException is a silent no-op. See src/worker.ts.
main = "src/worker.ts"
compatibility_flags = ["nodejs_compat"]

# Sentry version tracking
[version_metadata]
binding = "CF_VERSION_METADATA"

# Workers.dev subdomain configuration
# Set to false to disable *.workers.dev routes (use custom domains instead)
workers_dev = false

# Preview URLs configuration
# Set to true to enable preview URLs for testing deployments
preview_urls = false

[observability]
enabled = true

# CPU time limits for Workers
# Default is 30000ms (30 seconds), increased for seed API routes
[limits]
cpu_ms = 300000  # 5 minutes for seeding operations

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 Database Binding
[[d1_databases]]
binding = "D1"
database_name = "sahajcloud"
database_id = "7e2a195b-6c28-45de-9f81-cd72dce835b8"
remote = true

# R2 Storage Binding
[[r2_buckets]]
binding = "R2"
bucket_name = "sahajcloud"
jurisdiction = "eu"
remote = true

# Rate Limiting Binding (Workers Rate Limiting API)
# 500 requests per 60 seconds per unique (Client + IP + User ID) key
# See: https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 500, period = 60 }

# Environment Variables (non-sensitive)
[vars]
NODE_ENV = "production"
NEXT_PUBLIC_LOG_LEVEL = "debug"  # Set to 'debug', 'info', 'warn', 'error', or 'silent'
SAHAJCLOUD_URL = "https://cloud.sydevelopers.com"
WEMEDITATE_WEB_URL = "https://wemeditate-web.contact-c66.workers.dev"
SAHAJATLAS_URL = "https://atlas.sydevelopers.com"

# Cloudflare Services Configuration
# Account-level identifiers and delivery URLs (public, non-sensitive)
CLOUDFLARE_ACCOUNT_ID = "c66c53a69689eb030b228c450515fff2"  # Find in: Dashboard → Account Home → right sidebar
CLOUDFLARE_IMAGES_DELIVERY_URL = "https://imagedelivery.net/dOm4imjweFFL1Pto29l-4Q"  # Full URL: https://imagedelivery.net/<hash>
CLOUDFLARE_STREAM_DELIVERY_URL = "https://customer-aorobtik2fce41s5.cloudflarestream.com"  # Full URL: https://customer-<code>.cloudflarestream.com
CLOUDFLARE_R2_DELIVERY_URL = "https://assets.sydevelopers.com"  # Custom domain for R2

# Sentry Configuration (public - visible to client and server)
# Single DSN used for both client-side and server-side error tracking
# Set your Sentry DSN here for production deployment
# NEXT_PUBLIC_SENTRY_DSN = "https://your-public-key@o0000000.ingest.us.sentry.io/0000000"

# Secrets (sensitive - set via wrangler secret put)
# See .env.example for list of required secrets
# Set with: wrangler secret put <SECRET_NAME>

# Build Configuration
[build]
command = "WRANGLER_BUILD_CONDITIONS=\"\" WRANGLER_BUILD_PLATFORM=\"node\" pnpm exec opennextjs-cloudflare build"

# ========================================
# Development Environment
# ========================================
# Use this environment for local development
# Start with: PORT=4567 pnpm dev

[env.dev]
name = "sahajcloud-dev"
workers_dev = true
preview_urls = true

# Sentry version tracking
[env.dev.version_metadata]
binding = "CF_VERSION_METADATA"

# D1 Database Binding (local development uses SQLite file)
[[env.dev.d1_databases]]
binding = "D1"
database_name = "sahajcloud-dev"
database_id = "local"

# R2 Storage Binding
[[env.dev.r2_buckets]]
binding = "R2"
bucket_name = "sahajcloud-dev"
jurisdiction = "eu"

# Rate Limiting Binding (Workers Rate Limiting API)
# Same configuration as production - disabled at runtime in development
[[env.dev.ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 500, period = 60 }

# Environment Variables
[env.dev.vars]
NODE_ENV = "development"
NEXT_PUBLIC_LOG_LEVEL = "debug"  # Set to 'debug', 'info', 'warn', 'error', or 'silent'
SAHAJCLOUD_URL = ""  # Empty in dev - automatically derived from PORT env var (see src/lib/serverUrl.ts)
WEMEDITATE_WEB_URL = "https://wemeditate-web.contact-c66.workers.dev"
SAHAJATLAS_URL = "http://localhost:5174"
SAHAJCLOUD_PREVIEW_SECRET = "dev-preview-secret-key-o450836791e38a8836791e38ad460da956738048"

# Cloudflare Services (optional in development - falls back to local storage if not set)
CLOUDFLARE_ACCOUNT_ID = ""
CLOUDFLARE_IMAGES_DELIVERY_URL = ""
CLOUDFLARE_STREAM_DELIVERY_URL = ""
CLOUDFLARE_R2_DELIVERY_URL = ""
